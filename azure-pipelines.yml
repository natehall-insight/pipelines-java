# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java


trigger:
- main

pool:
  vmImage: ubuntu-latest

parameters:
  - name: testOne
    type: string
    default: ''
  - name: testTwo
    type: string
    default: ''

steps:
- task: Bash@3
  inputs:
    targetType: inline
    script: |
      echo "Inputing variables"
      echo "testOne variable check"
      if [[ -z ${{testOne}} ]]; then
        echo "testOne not provided."
      else
        echo "testOne value: ${{testOne}}"
      fi
      echo "testTwo variable check"
      if [[ -z ${{testTwo}} ]]; then
        echo "testTwo not provided."
      else
        echo "testTwo value: ${{testTwo}}"
      fi

- task: Maven@3
  inputs:
    mavenPomFile: 'pom.xml'
    mavenOptions: '-Xmx3072m'
    javaHomeOption: 'JDKVersion'
    jdkVersionOption: '1.11'
    jdkArchitectureOption: 'x64'
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'
    goals: 'package'
