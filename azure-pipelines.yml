# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java


trigger:
- main

variables:
  - name: testOne
    value: ''
  - name: testTwo
    value: ''

pool:
  vmImage: ubuntu-latest

steps:
- task: Bash@3
  inputs:
    targetType: inline
    script: |
      echo "Inputing variables"
      echo "testOne variable check"
      if [[ -z "$TEST_ONE" ]]; then
        echo "testOne not provided."
      else
        echo "testOne value: $TEST_ONE"
      fi
      echo "testTwo variable check"
      if [[ -z "$TEST_TWO" ]]; then
        echo "testTwo not provided."
      else
        echo "testTwo value: $TEST_TWO"
      fi
  env:
    TEST_ONE: $(testOne)
    TEST_TWO: $(testTwo)

- task: Maven@3
  inputs:
    mavenPomFile: 'pom.xml'
    mavenOptions: '-Xmx3072m'
    javaHomeOption: 'JDKVersion'
    jdkVersionOption: '1.11'
    jdkArchitectureOption: 'x64'
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'
    goals: 'package'
